<app-auth-base-page>
    <div class="p-10" form-content>
        <div class="mb-10"><img src="https://customer-qa.bucksfield.com.ng/bucksfield-logo-dark.svg" alt=""></div>
    
        <div>
            <h1 class="font-semibold text-2xl">Setup your Profile 😊</h1>
            <p class="text-gray-500">Enter your details to set up your profile.</p>
        </div>
    
        <form class="mt-10 flex flex-col gap-4" [formRoot]="createProfileForm">
            <div class="w-full">
                <p class="text-gray-500 mb-1 font-semibold">Company Name</p>
                <input type="text" id="" placeholder="Enter your company name" [formField]="createProfileForm.companyName"
                    class="border border-gray-400 text-lg text-gray-800 p-2 w-full rounded-lg placeholder:text-sm placeholder:text-gray-400 focus:ring-2 focus:ring-bucks-primary focus:outline-none">
            </div>
            <div class="w-full">
                <p class="text-gray-500 mb-1 font-semibold">Registration Number</p>
                <input type="text" id="" placeholder="Enter your registration number" [formField]="createProfileForm.registrationNumber"
                    class="border border-gray-400 text-lg text-gray-800 p-2 w-full rounded-lg placeholder:text-sm placeholder:text-gray-400 focus:ring-2 focus:ring-bucks-primary focus:outline-none">
            </div>
            <div class="w-full">
                <p class="text-gray-500 mb-1 font-semibold">Company Industry</p>
                <input type="text" id="" placeholder="Enter your company industry" [formField]="createProfileForm.companyIndustry"
                    class="border border-gray-400 text-lg text-gray-800 p-2 w-full rounded-lg placeholder:text-sm placeholder:text-gray-400 focus:ring-2 focus:ring-bucks-primary focus:outline-none">
            </div>
            <div class="w-full">
                <p class="text-gray-500 mb-1 font-semibold">Company Size</p>
                <input type="text" id="" placeholder="Enter your company size" [formField]="createProfileForm.companySize"
                    class="border border-gray-400 text-lg text-gray-800 p-2 w-full rounded-lg placeholder:text-sm placeholder:text-gray-400 focus:ring-2 focus:ring-bucks-primary focus:outline-none">
            </div>
            <div class="w-full">
                <p class="text-gray-500 mb-1 font-semibold">Tax Identification Number</p>
                <input type="text" id="" placeholder="Enter your tax identification number" [formField]="createProfileForm.taxIdentificationNumber"
                    class="border border-gray-400 text-lg text-gray-800 p-2 w-full rounded-lg placeholder:text-sm placeholder:text-gray-400 focus:ring-2 focus:ring-bucks-primary focus:outline-none">
            </div>
            <div class="w-full">
                <p class="text-gray-500 mb-1 font-semibold">Date of Incorporation</p>
                <input type="text" id="" placeholder="Enter your date of incorporation" [formField]="createProfileForm.dateOfIncorporation"
                    class="border border-gray-400 text-lg text-gray-800 p-2 w-full rounded-lg placeholder:text-sm placeholder:text-gray-400 focus:ring-2 focus:ring-bucks-primary focus:outline-none">
            </div>
            <div class="w-full">
                <p class="text-gray-500 mb-1 font-semibold">Estimated Annual Revenue</p>
                <input type="text" id="" placeholder="Enter your estimated annual revenue" [formField]="createProfileForm.estimatedAnnualRevenue"
                    class="border border-gray-400 text-lg text-gray-800 p-2 w-full rounded-lg placeholder:text-sm placeholder:text-gray-400 focus:ring-2 focus:ring-bucks-primary focus:outline-none">
            </div>
            <div class="w-full">
                <p class="text-gray-500 mb-1 font-semibold">Company Address</p>
                <input type="text" id="" placeholder="Enter your company address" [formField]="createProfileForm.companyAddress"
                    class="border border-gray-400 text-lg text-gray-800 p-2 w-full rounded-lg placeholder:text-sm placeholder:text-gray-400 focus:ring-2 focus:ring-bucks-primary focus:outline-none">
            </div>
            <div class="w-full">
                <p class="text-gray-500 mb-1 font-semibold">State</p>
                <input type="text" id="" placeholder="Enter your state" [formField]="createProfileForm.state"
                    class="border border-gray-400 text-lg text-gray-800 p-2 w-full rounded-lg placeholder:text-sm placeholder:text-gray-400 focus:ring-2 focus:ring-bucks-primary focus:outline-none">
            </div>
            <div class="w-full">
                <p class="text-gray-500 mb-1 font-semibold">Local Government Area</p>
                <input type="text" id="" placeholder="Enter your local government area" [formField]="createProfileForm.localGovernmentArea"
                    class="border border-gray-400 text-lg text-gray-800 p-2 w-full rounded-lg placeholder:text-sm placeholder:text-gray-400 focus:ring-2 focus:ring-bucks-primary focus:outline-none">
            </div>
            <div class="mb-5">
                <button [disabled]="createProfileForm().invalid()" [class]="{ 'bg-bucks-tertiary': createProfileForm().invalid() }"
                    class="bg-bucks-primary text-white p-2 rounded-xl w-full text-center py-5 cursor-pointer"
                    (click)="createProfile()">Create Profile</button>
            </div>
        </form>
        <div>
            <!-- @if (loginForm.email().invalid()) {
            @for (error of loginForm.email().errors(); track $index) {
            <small>{{ error.message }}</small><br />
            }
            }
            @if (loginForm.password().invalid()) {
            @for (error of loginForm.password().errors(); track $index) {
            <small>{{ error.message }}</small><br />
            }
            } -->
        </div>
    
    
    </div>
</app-auth-base-page>
