<app-auth-base-page>
    <div class="p-10" form-content>
        <div class="mb-10"><img src="https://customer-qa.bucksfield.com.ng/bucksfield-logo-dark.svg" alt=""></div>
        <div>
            <h1 class="font-semibold text-2xl">Reset Password</h1>
            <p class="text-gray-500">Enter your email address to reset your password.</p>
        </div>

        <form class="mt-10 flex flex-col gap-4">
            <div class="w-full">
                <p class="text-gray-800 mb-1 font-semibold">Email Address</p>
                <input type="email" id="" placeholder="Enter your email address" [formField]="forgotPasswordForm.email"
                    class="border border-gray-400 text-lg text-gray-800 p-2 w-full rounded-lg placeholder:text-sm placeholder:text-gray-400 focus:ring-2 focus:ring-bucks-primary focus:outline-none">
            </div>
        </form>
        <div>
            @if (forgotPasswordForm.email().invalid()) {
                @for (error of forgotPasswordForm.email().errors(); track $index) {
                    <small>{{ error.message }}</small><br />
                }
            }
        </div>

        <div class="mt-10">
            <button [disabled]="forgotPasswordForm().invalid()" [class]="{ 'bg-bucks-tertiary': forgotPasswordForm().invalid() }"
            class="bg-bucks-primary text-white p-2 rounded-xl w-full text-center py-5 cursor-pointer" (click)="resetPassword()">Reset
                Password</button>
        </div>
    </div>
</app-auth-base-page>
