
<div class="p-10">
    <div class="mb-10"><img src="https://customer-qa.bucksfield.com.ng/bucksfield-logo-dark.svg" alt=""></div>

    <div>
        <h1 class="font-semibold text-2xl">Welcome, Investment Partner 😊</h1>
        <p class="text-gray-500">Enter your details to sign in to your account.</p>
    </div>

    <div class="mt-10 flex flex-col gap-4">
        <div class="w-full">
            <p class="text-gray-800 mb-1 font-semibold">Email Address</p>
            <input type="email" name="" id="" placeholder="Enter your email address" 
            class="border border-gray-400 text-lg text-gray-800 p-2 w-full rounded-lg placeholder:text-sm placeholder:text-gray-400 focus:ring-2 focus:ring-bucks-primary focus:outline-none">
        </div>

        <div class="w-full">
            <p class="text-gray-800 mb-1 font-semibold">Password</p>
            <div class="relative ">
                <input [type]="previewPassword() ? 'text' : 'password'" name="" id="" placeholder="Enter your password"
                    class="border border-gray-400 text-lg text-gray-800  w-full rounded-xl py-3 px-3 placeholder:text-sm placeholder:text-gray-400 focus:ring-2 focus:ring-bucks-primary focus:outline-none">
                <mat-icon class="text-gray-500 absolute right-2 top-1/2 transform -translate-y-1/2" (click)="togglePasswordPreview()">
                    {{ previewPassword() ? 'visibility_off' : 'visibility' }}
                </mat-icon>
            </div>
        </div>
    </div>

    <div class="flex w-full justify-end my-10"><a href="" class="text-bucks-primary cursor-pointer">Forgot Password?</a></div>

    <div class="mb-5">
        <button class="bg-bucks-primary text-white p-2 rounded-xl w-full text-center py-5 cursor-pointer">Sign In</button>
    </div>


    <div class="flex w-full justify-center">
        <p class="font-semibold">Don't have an account? <a href="" class="text-bucks-primary cursor-pointer">Create Account</a></p>
    </div>
</div>
